[package]
name = "tpi"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sven Rademakers <sven.rademakers@gmail.com>"]
description = "Official Turing-Pi2 CLI tool"
homepage = "https://turingpi.com/"
repository = "https://github.com/turing-machines/tpi"
readme = "README.md"
categories= ["command-line-interface"]
keywords= ["turing-pi", "tpi", "CLI", "edge-computing", "board-management"]
exclude = [".github", "deny.toml", "scripts/ci/*"]

[dependencies]
anyhow = "1.0.96"
clap = { version = "4.5.30", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5.45"
crossterm = "=0.24.0"
dirs = "6.0.0"
hex = { version = "0.4.3" }
indicatif = { version = "0.17.11", features = ["tokio"] }
platform-info = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "multipart", "stream"] }
ring = "0.17.8"
rustls = { version = "0.23.16", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26.6"
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["alloc"] }
serde_json = "1.0.139"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros", "fs", "time"] }
tokio-util = "0.7.13"
url = "2.5.4"
board-info = { git = "https://github.com/turing-machines/bmcd", features = ["clap_derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }



[features]
default = ["reqwest/rustls-no-provider"]
native-tls = ["reqwest/native-tls"]
localhost = ["board-info"]

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
