name: Build and Release Pipeline
# A TAG is the release act, matching bmcd and BMC-UI. Upstream built a
# release on every push to master, which makes "released" mean "merged" --
# and after the default branch became `hive`, it meant nothing at all: the
# workflow could no longer fire, so v1.1.0 was tagged and produced no
# binaries.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a release in flight: the tag is already public by the time
# this starts.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-pipeline:
    name: "Build ${{ matrix.target }}"
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          # macos-13 was GitHub's Intel image and no longer exists. A job
          # asking for a retired label does not fail -- it QUEUES, forever,
          # looking exactly like a slow build. Both v1.1.0 macOS jobs sat
          # unclaimed for 25 minutes before anyone looked at the log line
          # "Requested labels: macos-13 / Waiting for a runner".
          #
          # macos-15 is Apple silicon and macos-15-intel is Intel, so each
          # target builds natively rather than cross-compiling.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: '1.98.1'
          default: true
          profile: minimal
          target: ${{ matrix.target }}

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --locked --target=${{ matrix.target }}
          use-cross: ${{ matrix.cross }}

      - name: Create Unix Archive
        if: ${{ !contains(matrix.target, 'windows') }}
        env:
          TARGET: ${{ matrix.target }}
          srcdir: .
          pkgdir: /tmp/pkg
        run: |
          mkdir -p ${pkgdir}
          source scripts/ci/install
          tar -czf tpi-${{ matrix.target }}.tar.gz -C ${pkgdir} .

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        if: ${{ !contains(matrix.target, 'windows') }}
        with:
          name: ${{ matrix.target }}
          path: |
            tpi-${{ matrix.target }}.tar.gz

      - name: Upload Archive (Win)
        uses: actions/upload-artifact@v4
        if: ${{ contains(matrix.target, 'windows') }}
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tpi.exe

  debian-packages:
    runs-on: ubuntu-latest
    needs: build-pipeline
    strategy:
      matrix:
        target:
          - aarch64
          - x86_64
        include:
          - target: x86_64
            arch: amd64
          - target: aarch64
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-unknown-linux-gnu

      - name: Extract version from Cargo.toml
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG_NAME=tpi-$VERSION-${{ matrix.target }}-linux" >> $GITHUB_ENV

      - name: Extract tar.gz file
        run: |
          mkdir ${{ env.PKG_NAME }}
          tar -xf tpi-${{ matrix.target }}-unknown-linux-gnu.tar.gz -C ${{ env.PKG_NAME }}

      - name: Create DEBIAN package
        run: scripts/ci/create_debian_control.sh Cargo.toml ${{ matrix.arch }} ${{ env.PKG_NAME }}

      - run: dpkg-deb --build ${{ env.PKG_NAME }}

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}.deb
          path: ${{ env.PKG_NAME }}.deb

  release:
    # This job was upstream's, written for a push to master: read the version
    # from Cargo.toml, and if a tag for it already exists, abort. This fork
    # changed the trigger to the tag itself -- so the job ran BECAUSE the tag
    # was pushed, found it, and skipped every step that publishes anything.
    #
    # Every release since that change was green and empty: v1.1.0, v1.1.1,
    # v1.2.0, v1.2.1 and v1.2.2 have no artifacts and no release page, while
    # the site tells people to install this tool.
    #
    # A tag is the release act here. The tag exists; make the release from it.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: debian-packages
    permissions:
      contents: write   # the release itself; nothing else writes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      # A tag that disagrees with Cargo.toml means somebody tagged without
      # bumping, and the release page would then name a version the binaries
      # inside it do not report. Refuse rather than publish that.
      - name: the tag and Cargo.toml must agree
        run: |
          set -eu
          version=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "tag and manifest agree on ${version}"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true

      # Fail rather than publish an empty release, which is the failure this
      # job is here to stop repeating.
      - name: there must be something to release
        run: |
          set -eu
          count=$(find artifacts -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no artifacts to attach"; exit 1; }
          echo "attaching $count artifact(s):"
          find artifacts -type f -printf '  %p (%s bytes)\n'

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: tpi v${{ env.VERSION }}
          tag: ${{ github.ref_name }}
          artifacts: artifacts/*
          generateReleaseNotes: true
