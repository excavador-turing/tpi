name: Build and Release Pipeline
# A TAG is the release act, matching bmcd and BMC-UI. Upstream built a
# release on every push to master, which makes "released" mean "merged" --
# and after the default branch became `hive`, it meant nothing at all: the
# workflow could no longer fire, so v1.1.0 was tagged and produced no
# binaries.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a release in flight: the tag is already public by the time
# this starts.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-pipeline:
    name: "Build ${{ matrix.target }}"
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          # macos-13 was GitHub's Intel image and no longer exists. A job
          # asking for a retired label does not fail -- it QUEUES, forever,
          # looking exactly like a slow build. Both v1.1.0 macOS jobs sat
          # unclaimed for 25 minutes before anyone looked at the log line
          # "Requested labels: macos-13 / Waiting for a runner".
          #
          # macos-15 is Apple silicon and macos-15-intel is Intel, so each
          # target builds natively rather than cross-compiling.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: '1.98.1'
          default: true
          profile: minimal
          target: ${{ matrix.target }}

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --locked --target=${{ matrix.target }}
          use-cross: ${{ matrix.cross }}

      - name: Create Unix Archive
        if: ${{ !contains(matrix.target, 'windows') }}
        env:
          TARGET: ${{ matrix.target }}
          srcdir: .
          pkgdir: /tmp/pkg
        run: |
          mkdir -p ${pkgdir}
          source scripts/ci/install
          tar -czf tpi-${{ matrix.target }}.tar.gz -C ${pkgdir} .

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        if: ${{ !contains(matrix.target, 'windows') }}
        with:
          name: ${{ matrix.target }}
          path: |
            tpi-${{ matrix.target }}.tar.gz

      - name: Upload Archive (Win)
        uses: actions/upload-artifact@v4
        if: ${{ contains(matrix.target, 'windows') }}
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tpi.exe

  debian-packages:
    runs-on: ubuntu-latest
    needs: build-pipeline
    strategy:
      matrix:
        target:
          - aarch64
          - x86_64
        include:
          - target: x86_64
            arch: amd64
          - target: aarch64
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-unknown-linux-gnu

      - name: Extract version from Cargo.toml
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG_NAME=tpi-$VERSION-${{ matrix.target }}-linux" >> $GITHUB_ENV

      - name: Extract tar.gz file
        run: |
          mkdir ${{ env.PKG_NAME }}
          tar -xf tpi-${{ matrix.target }}-unknown-linux-gnu.tar.gz -C ${{ env.PKG_NAME }}

      - name: Create DEBIAN package
        run: scripts/ci/create_debian_control.sh Cargo.toml ${{ matrix.arch }} ${{ env.PKG_NAME }}

      - run: dpkg-deb --build ${{ env.PKG_NAME }}

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}.deb
          path: ${{ env.PKG_NAME }}.deb

  try-release:
    runs-on: ubuntu-latest
    needs: debian-packages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from Cargo.toml
        id: extract_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if tag exists
        run: |
          if git rev-parse --verify v${VERSION} >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "no new version detected, aborting release Pipeline"
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create new tag
        if: ${{ env.TAG_EXISTS == 'false' }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "noreply@turingpi.com"
          git tag -a "v${{ env.VERSION }}" -m "Release version ${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        if: ${{ env.TAG_EXISTS == 'false' }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        if: ${{ env.TAG_EXISTS == 'false' }}
        uses: ncipollo/release-action@v1
        with:
          name: tpi v${{ env.VERSION }}
          tag: v${{ env.VERSION }}
          artifacts: artifacts/*
          generateReleaseNotes: true
